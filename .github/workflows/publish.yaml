name: Publish App image

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  prepare:
    name: Prepare image build
    if: github.repository == 'nebhale/ha-filabridge'
    runs-on: ubuntu-latest
    outputs:
      architectures: ${{ steps.info.outputs.architectures }}
      build_matrix: ${{ steps.matrix.outputs.matrix }}
      description: ${{ steps.normalize.outputs.description }}
      image_name: ${{ steps.normalize.outputs.image_name }}
      name: ${{ steps.normalize.outputs.name }}
      registry_prefix: ${{ steps.normalize.outputs.registry_prefix }}
      url: ${{ steps.normalize.outputs.url }}
      version: ${{ steps.normalize.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1

      - name: Lint tagged App
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./filabridge"

      - name: Read App information
        id: info
        uses: home-assistant/actions/helpers/info@master
        with:
          path: "./filabridge"

      - name: Normalize App information
        id: normalize
        run: |
          image=${{ steps.info.outputs.image }}
          version=${{ steps.info.outputs.version }}
          name=${{ steps.info.outputs.name }}
          description=${{ steps.info.outputs.description }}
          url=${{ steps.info.outputs.url }}

          {
            echo "image=${image}"
            echo "image_name=${image##*/}"
            echo "registry_prefix=${image%/*}"
            echo "version=${version}"
            echo "name=${name}"
            echo "description=${description}"

            if [[ -n "${url}" && "${url}" != null ]]; then
              echo "url=${url}"
            fi
          } >>"${GITHUB_OUTPUT}"

      - name: Verify tag and image name
        env:
          IMAGE: ${{ steps.normalize.outputs.image }}
          VERSION: ${{ steps.normalize.outputs.version }}
        run: |
          if [[ "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match App version ${VERSION}" >&2
            exit 1
          fi

          if [[ "${IMAGE}" != "ghcr.io/nebhale/ha-filabridge" ]]; then
            echo "Unexpected App image: ${IMAGE}" >&2
            exit 1
          fi

      - name: Prepare build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ steps.info.outputs.architectures }}
          image-name: ${{ steps.normalize.outputs.image_name }}
          registry-prefix: ${{ steps.normalize.outputs.registry_prefix }}

  build:
    name: Build ${{ matrix.arch }} image
    needs: prepare
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.build_matrix) }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Build and publish image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          context: "./filabridge"
          image: ${{ matrix.image }}
          image-tags: ${{ needs.prepare.outputs.version }}
          labels: |
            io.hass.type=app
            io.hass.name=${{ needs.prepare.outputs.name }}
            io.hass.description=${{ needs.prepare.outputs.description }}
            ${{ needs.prepare.outputs.url && format('io.hass.url={0}', needs.prepare.outputs.url) || '' }}
          push: true
          version: ${{ needs.prepare.outputs.version }}

  manifest:
    name: Publish multi-architecture manifest
    needs:
      - prepare
      - build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      packages: write
    steps:
      - name: Publish multi-architecture manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ needs.prepare.outputs.architectures }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          image-name: ${{ needs.prepare.outputs.image_name }}
          image-tags: ${{ needs.prepare.outputs.version }}
          registry-prefix: ${{ needs.prepare.outputs.registry_prefix }}

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - manifest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v7.0.1

      - name: Create release
        run: |
          BASE_IMAGE="$(sed -nE 's/^FROM[[:space:]]+([^[:space:]]+)$/\1/p' filabridge/Dockerfile)"
          WRAPPER_IMAGE="ghcr.io/nebhale/ha-filabridge:${VERSION}"
          COMMIT="$(git rev-parse HEAD)"

          if [[ -z "${BASE_IMAGE}" ]]; then
            echo "Could not read the FilaBridge base image" >&2
            exit 1
          fi

          NOTES_FILE="$(mktemp)"
          trap 'rm -f "${NOTES_FILE}"' EXIT

          printf '%s\n' \
            "Publishes the Home Assistant App wrapper ${VERSION}." \
            "" \
            "- Wrapper image: \`${WRAPPER_IMAGE}\`" \
            "- FilaBridge base image: \`${BASE_IMAGE}\`" \
            "- Architectures: \`linux/amd64\`, \`linux/arm64\`" \
            "- Wrapper commit: \`${COMMIT}\`" \
            >"${NOTES_FILE}"

          PRERELEASE_ARGS=()
          if [[ "${VERSION}" == *-* ]]; then
            PRERELEASE_ARGS+=(--prerelease)
          fi

          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "FilaBridge ${VERSION}" \
            --notes-file "${NOTES_FILE}" \
            "${PRERELEASE_ARGS[@]}"
