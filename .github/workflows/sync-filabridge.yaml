name: Sync FilaBridge

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-filabridge
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read current App version
        id: current
        run: |
          VERSION="$(
            sed -nE \
              's/^version:[[:space:]]*"([^"]+)".*/\1/p' \
              filabridge/config.yaml
          )"

          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid current App version: ${VERSION}" >&2
            exit 1
          fi

          echo "version=${VERSION}" >>"${GITHUB_OUTPUT}"
          echo "Current App version: ${VERSION}"

      - name: Lint current App manifest
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./filabridge"

      - name: Find latest stable upstream release
        id: upstream
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          RELEASE="$(gh api repos/sargonas/filabridge/releases/latest)"
          TAG="$(jq -r '.tag_name' <<<"${RELEASE}")"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest upstream tag is not a stable vX.Y.Z release: ${TAG}" >&2
            exit 1
          fi

          VERSION="${TAG#v}"

          if dpkg --compare-versions "${VERSION}" lt "${CURRENT_VERSION}"; then
            echo "Refusing to downgrade from ${CURRENT_VERSION} to ${VERSION}" >&2
            exit 1
          fi

          if dpkg --compare-versions "${VERSION}" eq "${CURRENT_VERSION}"; then
            CHANGED=false
          else
            CHANGED=true
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "changed=${CHANGED}"
          } >>"${GITHUB_OUTPUT}"
          echo "Latest stable upstream release: ${TAG}"

      - name: Verify upstream multi-architecture image
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          IMAGE="ghcr.io/sargonas/filabridge:${VERSION}"
          echo "Inspecting ${IMAGE}"
          MANIFEST="$(docker manifest inspect "${IMAGE}")"

          jq -e '
            any(.manifests[];
              .platform.os == "linux" and
              .platform.architecture == "amd64"
            ) and
            any(.manifests[];
              .platform.os == "linux" and
              .platform.architecture == "arm64"
            )
          ' <<<"${MANIFEST}" >/dev/null

      - name: Update App manifest
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          sed -i -E \
            "s/^version: \"[^\"]+\"$/version: \"${VERSION}\"/" \
            filabridge/config.yaml

          grep -qx "version: \"${VERSION}\"" filabridge/config.yaml
          git diff --check

      - name: Lint updated App manifest
        if: steps.upstream.outputs.changed == 'true'
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./filabridge"

      - name: Commit, tag, and push App update
        if: steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          TAG="v${VERSION}"

          git add filabridge/config.yaml
          git diff --cached --check
          git commit -m "Update FilaBridge to ${VERSION}"
          git tag -a "${TAG}" -m "FilaBridge ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      - name: Create GitHub Release
        if: steps.upstream.outputs.changed == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          IMAGE="ghcr.io/sargonas/filabridge:${VERSION}"
          UPSTREAM_URL="https://github.com/sargonas/filabridge/releases/tag/${TAG}"
          VERSION_COMMIT="$(git rev-parse HEAD)"

          NOTES_FILE="$(mktemp)"
          trap 'rm -f "${NOTES_FILE}"' EXIT

          printf '%s\n\n' \
            "Updates the Home Assistant App wrapper to FilaBridge ${VERSION}." \
            "- Upstream release: ${UPSTREAM_URL}" \
            "- Container image: \`${IMAGE}\`" \
            "- Architectures: \`linux/amd64\`, \`linux/arm64\`" \
            "- Wrapper commit: \`${VERSION_COMMIT}\`" \
            "" \
            "The container image and application binaries are published by the upstream FilaBridge project; this release contains only Home Assistant packaging metadata." \
            >"${NOTES_FILE}"

          gh release create "${TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "FilaBridge ${VERSION}" \
            --notes-file "${NOTES_FILE}"
