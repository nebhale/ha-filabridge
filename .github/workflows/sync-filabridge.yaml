name: Sync FilaBridge

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: sync-filabridge
  cancel-in-progress: false

jobs:
  sync:
    name: Sync upstream release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out main with full history
        uses: actions/checkout@v7.0.1
        with:
          ref: main
          fetch-depth: 0

      - name: Configure release identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Read current App version
        id: current
        run: |
          VERSION="$(
            sed -nE \
              's/^version:[[:space:]]*"([^"]+)".*/\1/p' \
              filabridge/config.yaml
          )"

          if [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            PRERELEASE=false
          elif [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z.-]+$ ]]; then
            PRERELEASE=true
          else
            echo "Invalid current App version: ${VERSION}" >&2
            exit 1
          fi

          {
            echo "version=${VERSION}"
            echo "prerelease=${PRERELEASE}"
          } >>"${GITHUB_OUTPUT}"
          echo "Current App version: ${VERSION}"

      - name: Preserve prerelease test version
        if: steps.current.outputs.prerelease == 'true'
        run: echo "Skipping stable upstream sync while testing ${{ steps.current.outputs.version }}"

      - name: Lint current App manifest
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./filabridge"

      - name: Find latest stable upstream release
        id: upstream
        if: steps.current.outputs.prerelease != 'true'
        env:
          CURRENT_VERSION: ${{ steps.current.outputs.version }}
        run: |
          RELEASE="$(gh api repos/sargonas/filabridge/releases/latest)"
          TAG="$(jq -r '.tag_name' <<<"${RELEASE}")"

          if [[ ! "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Latest upstream tag is not a stable vX.Y.Z release: ${TAG}" >&2
            exit 1
          fi

          VERSION="${TAG#v}"

          if dpkg --compare-versions "${VERSION}" lt "${CURRENT_VERSION}"; then
            echo "Refusing to downgrade from ${CURRENT_VERSION} to ${VERSION}" >&2
            exit 1
          fi

          if dpkg --compare-versions "${VERSION}" eq "${CURRENT_VERSION}"; then
            CHANGED=false
          else
            CHANGED=true
          fi

          {
            echo "tag=${TAG}"
            echo "version=${VERSION}"
            echo "changed=${CHANGED}"
          } >>"${GITHUB_OUTPUT}"
          echo "Latest stable upstream release: ${TAG}"

      - name: Verify upstream multi-architecture image
        if: steps.current.outputs.prerelease != 'true' && steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          IMAGE="ghcr.io/sargonas/filabridge:${VERSION}"
          echo "Inspecting ${IMAGE}"
          MANIFEST="$(docker manifest inspect "${IMAGE}")"

          jq -e '
            any(.manifests[];
              .platform.os == "linux" and
              .platform.architecture == "amd64"
            ) and
            any(.manifests[];
              .platform.os == "linux" and
              .platform.architecture == "arm64"
            )
          ' <<<"${MANIFEST}" >/dev/null

      - name: Update App manifest
        if: steps.current.outputs.prerelease != 'true' && steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          sed -i -E \
            "s/^version: \"[^\"]+\"$/version: \"${VERSION}\"/" \
            filabridge/config.yaml

          sed -i -E \
            "s|^FROM ghcr.io/[^/]+/filabridge:[^[:space:]]+$|FROM ghcr.io/sargonas/filabridge:${VERSION}|" \
            filabridge/Dockerfile

          grep -qx "version: \"${VERSION}\"" filabridge/config.yaml
          grep -qx "FROM ghcr.io/sargonas/filabridge:${VERSION}" filabridge/Dockerfile
          git diff --check

      - name: Lint updated App manifest
        if: steps.current.outputs.prerelease != 'true' && steps.upstream.outputs.changed == 'true'
        uses: frenck/action-addon-linter@v2.21
        with:
          path: "./filabridge"

      - name: Commit, tag, and push App update
        if: steps.current.outputs.prerelease != 'true' && steps.upstream.outputs.changed == 'true'
        env:
          VERSION: ${{ steps.upstream.outputs.version }}
        run: |
          TAG="v${VERSION}"

          git add filabridge/config.yaml filabridge/Dockerfile
          git diff --cached --check
          git commit -m "Update FilaBridge to ${VERSION}"
          git tag -a "${TAG}" -m "FilaBridge ${VERSION}"
          git push --atomic origin HEAD:main "refs/tags/${TAG}"

      # Pushes made with GITHUB_TOKEN do not emit another workflow run, so the
      # updater explicitly dispatches the tag-based publisher.
      - name: Dispatch App image publication
        if: steps.current.outputs.prerelease != 'true' && steps.upstream.outputs.changed == 'true'
        env:
          TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          DISPATCHED=false

          for ATTEMPT in 1 2 3 4 5; do
            if gh workflow run publish.yaml \
              --repo "${GITHUB_REPOSITORY}" \
              --ref "${TAG}"; then
              DISPATCHED=true
              break
            fi

            echo "Publish dispatch attempt ${ATTEMPT} failed; retrying" >&2
            sleep 5
          done

          if [[ "${DISPATCHED}" != true ]]; then
            echo "Could not dispatch image publication for ${TAG}" >&2
            exit 1
          fi
